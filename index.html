<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Genius | Progr. Website I</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🧠 Jogo <span>Genius</span></div>
        <div class="nav-actions">
            <button id="start-btn">▶ Iniciar Jogo</button>
        </div>
    </nav>

    <main class="container">
        <section class="board-section">
            <div class="genius-board" id="genius-board">
                <div class="color-btn green" data-color="0"></div>
                <div class="color-btn red" data-color="1"></div>
                <div class="color-btn yellow" data-color="2"></div>
                <div class="color-btn blue" data-color="3"></div>
                <div class="center-circle">
                    <h2>GENIUS</h2>
                </div>
            </div>
        </section>

        <aside class="info-section">
            <div class="panel score-panel">
                <div class="score-display">
                    <div class="score-item"><span>RODADA</span><strong id="round-display">00</strong></div>
                    <div class="score-item"><span>PONTOS</span><strong id="score-display">0</strong></div>
                </div>
            </div>

            <div class="panel ranking-panel">
                <div class="panel-header">🏆 RANKING TOP 5</div>
                <ul id="ranking-list" class="ranking-list"></ul>
            </div>
        </aside>
    </main>

    <div id="modal-game-over" class="modal hidden">
        <div class="modal-content">
            <img src="https://cdn-icons-png.flaticon.com/512/11514/11514488.png" alt="Derrota" class="defeat-img">
            <h2>Você Perdeu!</h2>
            <p>Pontuação: <span id="final-score">0</span></p>
            <div class="input-group">
                <input type="text" id="player-name" maxlength="15" placeholder="Seu nome">
                <button id="save-ranking-btn">Salvar no Ranking</button>
            </div>
            <button id="close-modal-btn">Tentar Novamente</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
